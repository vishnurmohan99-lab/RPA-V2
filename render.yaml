# Render blueprint: one Docker web service. With SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY set
# (in the Render dashboard, not here — never commit a secret), all saved data and kept files
# live in Supabase, so no persistent disk is needed and this runs on the free plan. Leave those
# two unset and it falls back to local JSON files + disk instead — in that case add a `disk:`
# block back (see git history) and a paid plan, since local disk doesn't survive a redeploy.
services:
  - type: web
    name: atlas-automation
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
